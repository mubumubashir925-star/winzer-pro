<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winzera Pro | Super Admin</title><style>
:root{font-family:Inter,"Plus Jakarta Sans",system-ui,sans-serif;color-scheme:light;--green:#005e46;--ink:#182a3d;--muted:#7e91a7;--border:#dbe4ed}*{box-sizing:border-box}body{margin:0;background:#f0f4f8;color:var(--ink);font-size:13px}header{height:58px;background:#003c2e;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px}header b{font-size:14px}header small{display:block;color:#83ddc2;font-size:10px;font-weight:500}main{max-width:600px;margin:18px auto;padding:0 10px}.hidden{display:none!important}button{cursor:pointer;border:0;border-radius:9px;background:#006c50;color:white;padding:10px 15px;font-weight:650;font:inherit}button:hover{filter:brightness(.96)}header button{background:#ffffff18;color:white;padding:8px 12px}.card{background:white;border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:15px}h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:0 0 16px}label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#60738c;margin-bottom:12px}input,select,textarea{width:100%;border:1px solid #cfdae6;border-radius:8px;background:white;color:var(--ink);padding:10px 12px;font:inherit;outline-color:#008663}label input{display:block;margin-top:5px}input[type=date]{min-height:39px}.muted{color:var(--muted);font-size:12px}.hidden{display:none!important}#busy{position:fixed;inset:0;background:#ffffffd9;display:none;place-items:center;z-index:2147483647;color:var(--green);font-weight:700}#busy.active{display:flex;align-items:center;justify-content:center;gap:12px}#busy:before{content:"";width:32px;height:32px;border:4px solid #d1eae1;border-top-color:#007c5a;border-radius:50%;animation:wzspin .8s linear infinite;margin-right:12px}@keyframes wzspin{to{transform:rotate(360deg)}}#notice{position:fixed;top:72px;right:18px;z-index:100;background:#173d34;color:white;border-radius:10px;padding:12px 16px;box-shadow:0 6px 24px #0003;max-width:min(420px,calc(100vw - 36px));white-space:pre-wrap;margin:0;font-size:13px}#notice:empty{display:none}#notice.error{background:#9b3232}#notice.success{background:#006a4c}#login{max-width:340px;margin:12vh auto;box-shadow:0 10px 40px #0000000c}#login button{width:100%}#dashboard{min-height:65vh}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:white;border:1px solid var(--border);border-radius:11px;text-align:center;padding:11px 5px}.stat small{display:block;color:#8d9ab2;font-size:9px;font-weight:700;text-transform:uppercase}.stat strong{font-size:17px}.toolbar{display:flex;gap:8px;margin-bottom:15px}.toolbar select{width:115px;flex-shrink:0}.toolbar input{flex:1;min-width:0}.detail{background:white;border:1px solid var(--border);border-radius:12px;margin:7px 0;overflow:hidden}.detail[open]{border-color:#57c99b}.detail summary{cursor:pointer;list-style:none;padding:13px 12px;font-weight:750}.detail summary::-webkit-details-marker{display:none}.detail summary:after{content:"⌄";float:right;color:#91a4bc}.detail[open] summary:after{content:"⌃"}.detail summary small{display:block;color:#7890a4;font-weight:500;margin-top:5px}.detail summary .active{color:#05955e}.detail summary .suspended{color:#b45309}.detailBody{padding:5px 12px 12px;border-top:1px solid #edf1f5}.detailBody p{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eef1f5;padding:7px 0;margin:0;font-size:11px}.detailBody p b{color:#8b9aab;font-weight:500}.detailBody p span{overflow-wrap:anywhere;text-align:right}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:11px;padding:8px 10px;background:#e8f5ff;color:#17668b}.actions button:first-child,.actions button:nth-child(2){background:#d8f9e6;color:#006444}.actions button:last-child{background:#ffe5e5;color:#ad2828}.floating{position:fixed;bottom:20px;right:20px;background:#008563;box-shadow:0 5px 15px #00856344;border-radius:30px;padding:14px 19px;font-weight:750}.modal{border:0;border-radius:14px;background:white;color:var(--ink);width:min(94vw,380px);max-height:85vh;padding:0;box-shadow:0 20px 50px #0003}.modal::backdrop{background:#182536b0}.modalTitle{position:sticky;top:0;background:white;padding:17px 17px 8px;display:flex;align-items:center;justify-content:space-between;z-index:2}.modalTitle h2{margin:0}.modalTitle button{background:none;color:#8799ae;padding:3px 8px;font-size:19px}.modalInner{padding:8px 17px 18px;max-height:65vh;overflow:auto}.modalFoot{position:sticky;bottom:0;background:white;display:flex;gap:8px;padding:10px 17px 16px}.modalFoot button{flex:1}.modalFoot .cancel{background:#edf2f6;color:#46566b}.modal textarea{resize:vertical}#shareText{font-family:monospace;font-size:12px}#stats{display:none}@media(max-width:480px){main{margin:14px auto}.floating{bottom:14px;right:14px}.toolbar select{width:96px}.stat strong{font-size:15px}}
</style></head><body>
<div id="busy" role="status" aria-live="polite">Loading, please wait…</div>
<header><div><b>Platform Admin</b><small>Manage institutions</small></div><div><button id="myLogin">My login</button> <button id="logout" class="hidden">Logout</button></div></header>
<main>
<section id="login" class="card"><h1 style="text-align:center">Platform Admin</h1><p class="muted" style="text-align:center">Owner access only</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Log in</button></form></section>
<section id="dashboard" class="hidden">
<div class="stats"><div class="stat"><small>Institutions</small><strong id="statTotal">0</strong></div><div class="stat"><small>Active</small><strong id="statActive">0</strong></div><div class="stat"><small>Participants</small><strong id="statParticipants">—</strong></div></div>
<div class="toolbar"><select id="filter" aria-label="Filter institutions"><option value="all">All</option><option value="active">Active</option><option value="suspended">Suspended</option></select><input id="search" type="search" placeholder="Search institutions..." aria-label="Search institutions"></div>
<div id="stats"></div><div id="institutions"></div>
<button id="addInstitution" type="button" class="floating" onclick="document.getElementById('createDialog').showModal()">＋ Add institution</button>
</section><p id="notice" role="alert"></p>
</main>
<dialog id="createDialog" class="modal"><div class="modalTitle"><h2>Add Institution</h2><button type="button" id="closeCreate" aria-label="Close" onclick="document.getElementById('createDialog').close()">×</button></div><form id="createForm"><div class="modalInner"><label>Institution name<input id="name" maxlength="150" required></label><label>Web address (letters, numbers, hyphens)<input id="slug" required maxlength="40" pattern="[a-z0-9][a-z0-9-]{1,38}[a-z0-9]"></label><label>Admin username<input id="adminUsername" value="admin" required minlength="3" maxlength="32" autocomplete="off"></label><label>Admin password<input id="adminPassword" type="text" required minlength="8" autocomplete="off"></label><label>Plan name<input id="plan" value="standard"></label><label>Paid until (optional)<input id="paidUntil" type="date"></label><label>Participant limit (0 = unlimited)<input id="participantLimit" type="number" min="0" value="0"></label><label>Contact (phone/email)<input id="contact"></label><label>Notes<input id="notes"></label><p id="preview" class="muted"></p></div><div class="modalFoot"><button type="button" class="cancel" id="cancelCreate" onclick="document.getElementById('createDialog').close()">Cancel</button><button type="submit">Create institution</button></div></form></dialog>
<dialog id="shareDialog" class="modal"><div class="modalTitle"><h2>Share with the institution</h2><button id="closeShareTop" type="button">×</button></div><div class="modalInner"><label>Message (copy it or share on WhatsApp)<textarea id="shareText" readonly rows="13"></textarea></label></div><div class="modalFoot"><button id="closeShare" class="cancel" type="button">Cancel</button><button id="copyShare" type="button">Copy / Share</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/assets/winzera-super-admin.js?v=20261027c"></script></body></html>
