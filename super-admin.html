<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winzera Pro | Super Admin</title><style>:root{font-family:system-ui;color-scheme:dark}*{box-sizing:border-box}body{background:#100b20;color:#fff;margin:0}header{padding:20px;border-bottom:1px solid #ffffff22;display:flex;justify-content:space-between}main{max-width:800px;margin:30px auto;padding:0 18px}.card{background:#241839;padding:22px;border-radius:16px;margin-bottom:18px}input{display:block;width:100%;padding:13px;margin:7px 0 16px;border-radius:8px;border:1px solid #76668e;background:#130d21;color:#fff}button{padding:12px 18px;border:0;border-radius:8px;background:#8a58de;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}label{font-size:14px}.muted{color:#c0b2d2;font-size:13px}.hidden{display:none!important}#busy{position:fixed;inset:0;background:#100b20e8;display:none;place-items:center;z-index:10}#busy.active{display:grid}#notice{color:#ffcc89;white-space:pre-wrap}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff25;padding:14px 0;gap:10px;flex-wrap:wrap}a{color:#d6baff}select{background:#130d21;color:#fff;border:1px solid #76668e;border-radius:8px;padding:10px}dialog{border:1px solid #8a58de;border-radius:16px;background:#241839;color:#fff;max-width:95vw}dialog::backdrop{background:#0009}.row{align-items:flex-start}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button{font-size:12px;padding:8px 10px}.detail{padding:12px;border-top:1px solid #ffffff25}.detail p{margin:7px 0;font-size:13px;overflow-wrap:anywhere}</style></head><body><div id="busy" role="status" aria-live="polite">Loading, please wait…</div><header><b>Winzera Pro · Super Admin</b><button id="logout" class="hidden">Sign out</button></header><main><section id="login" class="card"><h1>Super Admin Login</h1><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section><section id="dashboard" class="hidden"><div class="card"><h1>Institutions</h1><div style="display:flex;gap:8px;margin:15px 0"><input id="search" placeholder="Search institutions..." aria-label="Search institutions"><select id="filter" aria-label="Status"><option value="all">All</option><option value="active">Active</option><option value="suspended">Suspended</option></select></div><div id="stats" class="muted"></div><div id="institutions"></div></div><div class="card"><h2>Create Institution</h2><form id="createForm"><label>Institution name<input id="name" maxlength="150" required></label><label>URL slug<input id="slug" required maxlength="40" pattern="[a-z0-9][a-z0-9-]{1,38}[a-z0-9]"></label><label>Admin username<input id="adminUsername" value="admin" required minlength="3" maxlength="32" autocomplete="off"></label><label>Admin password<input id="adminPassword" type="text" required minlength="8" autocomplete="off"></label><label>Plan name<input id="plan" value="standard"></label><label>Paid until (optional)<input id="paidUntil" type="date"></label><label>Participant limit (0 = unlimited)<input id="participantLimit" type="number" min="0" value="0"></label><label>Contact (phone/email)<input id="contact"></label><label>Notes<input id="notes"></label><p class="muted" id="preview"></p><button>Create Institution</button></form><p class="muted">Credentials are provisioned in Supabase Auth through a protected Edge Function. Passwords are never stored as plaintext in tables.</p></div></section><p id="notice" role="alert"></p><dialog id="shareDialog"><h2>Share with the institution</h2><textarea id="shareText" readonly rows="15" style="width:min(75vw,490px);background:#130d21;color:#fff;padding:12px"></textarea><p><button id="copyShare">Copy / Share</button> <button id="closeShare" type="button">Close</button></p></dialog></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/assets/winzera-super-admin.js"></script></body></html>
