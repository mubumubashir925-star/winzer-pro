<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Winzera Pro | Super Admin</title><style>:root{font-family:system-ui;color-scheme:dark}*{box-sizing:border-box}body{background:#100b20;color:#fff;margin:0}header{padding:20px;border-bottom:1px solid #ffffff22;display:flex;justify-content:space-between}main{max-width:800px;margin:30px auto;padding:0 18px}.card{background:#241839;padding:22px;border-radius:16px;margin-bottom:18px}input{display:block;width:100%;padding:13px;margin:7px 0 16px;border-radius:8px;border:1px solid #76668e;background:#130d21;color:#fff}button{padding:12px 18px;border:0;border-radius:8px;background:#8a58de;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.5}label{font-size:14px}.muted{color:#c0b2d2;font-size:13px}.hidden{display:none!important}#busy{position:fixed;inset:0;background:#100b20e8;display:none;place-items:center;z-index:10}#busy.active{display:grid}#notice{color:#ffcc89;white-space:pre-wrap}.row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff25;padding:14px 0;gap:10px;flex-wrap:wrap}a{color:#d6baff}</style></head><body><div id="busy" role="status" aria-live="polite">Loading, please wait…</div><header><b>Winzera Pro · Super Admin</b><button id="logout" class="hidden">Sign out</button></header><main><section id="login" class="card"><h1>Super Admin Login</h1><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section><section id="dashboard" class="hidden"><div class="card"><h1>Institutions</h1><div id="institutions"></div></div><div class="card"><h2>Create Institution</h2><form id="createForm"><label>Institution name<input id="name" maxlength="150" required></label><label>URL slug<input id="slug" required maxlength="40" pattern="[a-z0-9][a-z0-9-]{1,38}[a-z0-9]"></label><p class="muted" id="preview"></p><button>Create Institution</button></form><p class="muted">Admin account creation requires a secure server-side provisioning endpoint; passwords must never be saved directly in the organizations table.</p></div></section><p id="notice" role="alert"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="/assets/winzera-super-admin.js"></script></body></html>
