html, body, #app, #app * {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
/* Inputs, textareas and content-editable areas must stay usable */
input, textarea, select, [contenteditable="true"] {
  -webkit-user-select: text !important;
  -moz-user-select: text !important;
  -ms-user-select: text !important;
  user-select: text !important;
}
img, canvas, svg {
  -webkit-user-drag: none;
  user-drag: none;

}

<script id="wz-source-protection">
// ---- Source protection (deterrent only, not real security) ----
// Disable right-click / context menu
document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; }, false);

// Block common "view/inspect source" keyboard shortcuts
document.addEventListener('keydown', function(e){
  var k = (e.key || '').toUpperCase();
  // F12
  if (e.key === 'F12') { e.preventDefault(); return false; }
  // Ctrl/Cmd + U (view source), Ctrl/Cmd + S (save page)
  if ((e.ctrlKey || e.metaKey) && (k === 'U' || k === 'S')) { e.preventDefault(); return false; }
  // Ctrl/Cmd + Shift + I / J / C (devtools panels)
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === 'I' || k === 'J' || k === 'C')) { e.preventDefault(); return false; }
}, false);

// Lightweight anti-inspection debugger: periodically checks whether devtools
// appear open (via the debugger-statement timing trick) and nudges focus away.
// This is a deterrent for casual users only; it cannot stop a determined user.
(function(){
  var checkInterval = 2500;
  function antiDebug(){
    var start = performance.now();
    debugger;
    var elapsed = performance.now() - start;
    if (elapsed > 100) {
      // devtools likely open (the debugger statement paused execution)
      try { console.clear(); } catch(e){}
    }
  }
  setInterval(antiDebug, checkInterval);
})();
</script>
